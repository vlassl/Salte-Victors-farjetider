name: Uppdatera färjetider

on:
  schedule:
    - cron: '15 2 * * *'      # varje natt 02:15 UTC
  workflow_dispatch:           # går även att köra manuellt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hämta tidtabeller
        env:
          TRV_KEY: ${{ secrets.TRV_KEY }}
        run: node fetch-timetables.js
      - name: Commit om något ändrats
        run: |
          git config user.name  "farjetider-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json log/ || true
          if git diff --staged --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Uppdaterade färjetider $(date -u +%Y-%m-%d)"
            git push
          fi
